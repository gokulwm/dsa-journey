<text x='270.0' y='330' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#6b7280' font-weight='normal'>queue[ ]  (level by level, left to right)</text>
<rect x='580' y='62' width='320' height='138' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='594' y='86' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>For a node at 0-based index i</text>
<text x='594' y='108' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>parent(i) = (i - 1) / 2   (integer division)</text>
<text x='594' y='127' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>left(i)   = 2i + 1</text>
<text x='594' y='146' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>right(i)  = 2i + 2</text>
<text x='594' y='165' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Example i = 1:  parent 0, left 3, right 4</text>
<rect x='580' y='214' width='320' height='108' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='594' y='238' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Why this works</text>
<text x='594' y='260' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Shape is complete, so the levels pack</text>
<text x='594' y='279' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>into the array with no holes. Moving</text>
<text x='594' y='298' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>up or down is just arithmetic.</text>
<rect x='580' y='336' width='320' height='84' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='594' y='360' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Heapify starts at index n/2 - 1</text>
<text x='594' y='382' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>The last non-leaf node. For n = 7 that is</text>
<text x='594' y='401' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>index 2 (children at 5 and 6).</text>
</svg>
