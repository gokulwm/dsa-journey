<svg xmlns='http://www.w3.org/2000/svg' width='880' height='580' viewBox='0 0 880 580'>
<rect x='0.5' y='0.5' width='879' height='579' rx='10' fill='white' stroke='#d0d7de'/>
<text x='440' y='30' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#1f2a37' font-weight='bold'>Sift-down: poll() on the min-heap [1, 3, 2, 7, 4, 5, 6]</text>
<rect x='20' y='48' width='420' height='245' rx='8' fill='#fbfcfd' stroke='#e5e9ee'/>
<line x1='230.0' y1='86' x2='130.0' y2='142' stroke='#9aa7b8' stroke-width='2'/>
<line x1='230.0' y1='86' x2='330.0' y2='142' stroke='#9aa7b8' stroke-width='2'/>
<line x1='130.0' y1='142' x2='80.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<line x1='130.0' y1='142' x2='180.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<line x1='330.0' y1='142' x2='280.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<circle cx='230.0' cy='86' r='17' fill='#ffd54f' stroke='#b28704' stroke-width='2'/>
<text x='230.0' y='90.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>6</text>
<circle cx='130.0' cy='142' r='17' fill='#ffab91' stroke='#bf5b3d' stroke-width='2'/>
<text x='130.0' y='146.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>3</text>
<circle cx='330.0' cy='142' r='17' fill='#ffab91' stroke='#bf5b3d' stroke-width='2'/>
<text x='330.0' y='146.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>2</text>
<circle cx='80.0' cy='198' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='80.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>7</text>
<circle cx='180.0' cy='198' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='180.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>4</text>
<circle cx='280.0' cy='198' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='280.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>5</text>
<text x='230.0' y='270' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#1f2a37' font-weight='bold'>1. poll() returns 1; move last element (6) to root</text>
<text x='230.0' y='287' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' fill='#6b7280' font-weight='normal'>children are 3 and 2; the smaller is 2, and 2 &lt; 6, so swap</text>
<rect x='450' y='48' width='420' height='245' rx='8' fill='#fbfcfd' stroke='#e5e9ee'/>
<line x1='660.0' y1='86' x2='560.0' y2='142' stroke='#9aa7b8' stroke-width='2'/>
<line x1='660.0' y1='86' x2='760.0' y2='142' stroke='#9aa7b8' stroke-width='2'/>
<line x1='560.0' y1='142' x2='510.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<line x1='560.0' y1='142' x2='610.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<line x1='760.0' y1='142' x2='710.0' y2='198' stroke='#9aa7b8' stroke-width='2'/>
<circle cx='660.0' cy='86' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='660.0' y='90.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>2</text>
<circle cx='560.0' cy='142' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='560.0' y='146.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>3</text>
<circle cx='760.0' cy='142' r='17' fill='#ffd54f' stroke='#b28704' stroke-width='2'/>
<text x='760.0' y='146.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>6</text>
<circle cx='510.0' cy='198' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='510.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>7</text>
<circle cx='610.0' cy='198' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='610.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>4</text>
<circle cx='710.0' cy='198' r='17' fill='#ffab91' stroke='#bf5b3d' stroke-width='2'/>
<text x='710.0' y='202.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>5</text>
<text x='660.0' y='270' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#1f2a37' font-weight='bold'>2. 6 is now at index 2</text>
<text x='660.0' y='287' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' fill='#6b7280' font-weight='normal'>its only child (index 5) holds 5, and 5 &lt; 6, so swap</text>
<rect x='20' y='306' width='420' height='245' rx='8' fill='#fbfcfd' stroke='#e5e9ee'/>
<line x1='230.0' y1='344' x2='130.0' y2='400' stroke='#9aa7b8' stroke-width='2'/>
<line x1='230.0' y1='344' x2='330.0' y2='400' stroke='#9aa7b8' stroke-width='2'/>
<line x1='130.0' y1='400' x2='80.0' y2='456' stroke='#9aa7b8' stroke-width='2'/>
<line x1='130.0' y1='400' x2='180.0' y2='456' stroke='#9aa7b8' stroke-width='2'/>
<line x1='330.0' y1='400' x2='280.0' y2='456' stroke='#9aa7b8' stroke-width='2'/>
<circle cx='230.0' cy='344' r='17' fill='#a5d6a7' stroke='#2e7d32' stroke-width='2'/>
<text x='230.0' y='348.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>2</text>
<circle cx='130.0' cy='400' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='130.0' y='404.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>3</text>
<circle cx='330.0' cy='400' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='330.0' y='404.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>5</text>
<circle cx='80.0' cy='456' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='80.0' y='460.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>7</text>
<circle cx='180.0' cy='456' r='17' fill='#e3ecf9' stroke='#4a6fa5' stroke-width='2'/>
<text x='180.0' y='460.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>4</text>
<circle cx='280.0' cy='456' r='17' fill='#a5d6a7' stroke='#2e7d32' stroke-width='2'/>
<text x='280.0' y='460.9' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='middle' fill='#1f2a37' font-weight='bold'>6</text>
<text x='230.0' y='528' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#1f2a37' font-weight='bold'>3. 6 reached index 5, a leaf: stop</text>
<text x='230.0' y='545' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' fill='#6b7280' font-weight='normal'>heap = [2, 3, 5, 7, 4, 6]; the new minimum 2 is at the root</text>
<rect x='450' y='306' width='400' height='245' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='464' y='330' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Cost of one poll()</text>
<text x='464' y='352' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Each level costs 2 comparisons: smaller child</text>
<text x='464' y='371' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>vs. sibling, then child vs. the moving element.</text>
<text x='464' y='390' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'></text>
<text x='464' y='409' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>The path is at most the tree height,</text>
<text x='464' y='428' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>floor(log2 n) levels, so poll() is O(log n).</text>
<text x='464' y='447' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'></text>
<text x='464' y='466' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Why the SMALLER child? It is the only choice</text>
<text x='464' y='485' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>that keeps the new parent &lt;= both children.</text>
<circle cx='30' cy='566' r='8' fill='#ffd54f' stroke='#b28704' stroke-width='2'/>
<text x='44' y='570' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280' font-weight='normal'>element being moved</text>
<circle cx='185.39999999999998' cy='566' r='8' fill='#ffab91' stroke='#bf5b3d' stroke-width='2'/>
<text x='199.39999999999998' y='570' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280' font-weight='normal'>node it is compared with</text>
<circle cx='373.79999999999995' cy='566' r='8' fill='#a5d6a7' stroke='#2e7d32' stroke-width='2'/>
<text x='387.79999999999995' y='570' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' fill='#6b7280' font-weight='normal'>settled</text>
</svg>
