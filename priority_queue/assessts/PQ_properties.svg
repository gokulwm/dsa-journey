<text x='406.0' y='364.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#1f2a37' font-weight='bold'>6</text>
<text x='406.0' y='394' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#6b7280' font-weight='normal'>6</text>
<text x='250.0' y='330' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#6b7280' font-weight='normal'>backing array  queue[ ]</text>
<rect x='520' y='62' width='380' height='108' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='534' y='86' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Shape property</text>
<text x='534' y='108' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Complete binary tree: every level is full</text>
<text x='534' y='127' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>except possibly the last, which fills left</text>
<text x='534' y='146' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>to right. So it fits in an array with no gaps.</text>
<rect x='520' y='184' width='380' height='108' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='534' y='208' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Order property (min-heap)</text>
<text x='534' y='230' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Every parent &lt;= each of its children.</text>
<text x='534' y='249' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Therefore the root is the global minimum.</text>
<text x='534' y='268' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Max-heap: flip the inequality.</text>
<rect x='520' y='306' width='380' height='108' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='534' y='330' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' fill='#1f2a37' font-weight='bold'>Only a partial order</text>
<text x='534' y='352' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>Siblings (3 and 2) and cousins (7 and 5)</text>
<text x='534' y='371' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>have no guaranteed order. Only ancestor to</text>
<text x='534' y='390' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' text-anchor='start' fill='#374151' font-weight='normal'>descendant is ordered; it is NOT a sorted list.</text>
</svg>
